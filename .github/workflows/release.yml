name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    uses: rejmann/github-actions/.github/workflows/version-tag.yml@main
    secrets: inherit

  build:
    name: Build & Release
    needs: version
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: pvm
            archive_ext: .tar.gz
          - goos: darwin
            goarch: arm64
            bin: pvm
            archive_ext: .tar.gz
          - goos: windows
            goarch: amd64
            bin: pvm.exe
            archive_ext: .zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          MODULE_PATH=$(go list -m)
          OUT_DIR=dist/${{ matrix.goos }}-${{ matrix.goarch }}
          BIN=${{ matrix.bin }}
          mkdir -p "${OUT_DIR}"

          go build -ldflags "-s -w -X \
            ${MODULE_PATH}/cmd.version=${{ needs.version.outputs.version }}" \
            -o "${OUT_DIR}/${BIN}" .

          cd "${OUT_DIR}"

          PACK_CMD=$([ "${{ matrix.goos }}" = "windows" ] && echo "zip -9" || echo "tar -czf")
          ${PACK_CMD} "../pvm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}" "${BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pvm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}

  release:
    name: Publish Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
