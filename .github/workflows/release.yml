name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Resolve Version Tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve/Create release tag
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          existing_tag=$(git tag --points-at HEAD 'v*' | head -n1 || true)
          if [ -n "${existing_tag}" ]; then
            echo "Reusing existing tag ${existing_tag}"
            echo "version=${existing_tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "${latest_tag}" ]; then
            latest_tag="v1.0.0"
          fi

          version_core=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "${version_core}"

          next_patch=$((patch + 1))
          next_tag="v${major}.${minor}.${next_patch}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${next_tag}" -m "Release ${next_tag}"
          git push origin "${next_tag}"

          echo "version=${next_tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Release
    needs: version
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: pvm
            archive_ext: .tar.gz
          - goos: darwin
            goarch: arm64
            bin: pvm
            archive_ext: .tar.gz
          - goos: windows
            goarch: amd64
            bin: pvm.exe
            archive_ext: .zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          MODULE_PATH=$(go list -m)
          OUT_DIR=dist/${{ matrix.goos }}-${{ matrix.goarch }}
          BIN=${{ matrix.bin }}
          mkdir -p "${OUT_DIR}"

          go build -ldflags "-s -w -X \
            ${MODULE_PATH}/cmd.version=${{ needs.version.outputs.version }}" \
            -o "${OUT_DIR}/${BIN}" .

          cd "${OUT_DIR}"

          PACK_CMD=$([ "${{ matrix.goos }}" = "windows" ] && echo "zip -9" || echo "tar -czf")
          ${PACK_CMD} "../pvm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}" "${BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pvm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}

  release:
    name: Publish Release
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
