name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the binary; also the git ref checked out when set (e.g. v1.0.2).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            bin: pvm
            archive_ext: .tar.gz
          - goos: darwin
            goarch: arm64
            bin: pvm
            archive_ext: .tar.gz
          - goos: windows
            goarch: amd64
            bin: pvm.exe
            archive_ext: .zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version || 'dev' }}
        run: |
          set -euo pipefail

          OUT_DIR=dist/${{ matrix.goos }}-${{ matrix.goarch }}
          BIN=${{ matrix.bin }}
          mkdir -p "${OUT_DIR}"

          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${OUT_DIR}/${BIN}" .

          cd "${OUT_DIR}"

          PACK_CMD=$([ "${{ matrix.goos }}" = "windows" ] && echo "zip -9" || echo "tar -czf")
          ${PACK_CMD} "../pvm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}" "${BIN}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/pvm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.archive_ext }}
