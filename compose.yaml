services:
  go:
    build:
      context: .
      target: source
    user: "${PVM_UID:-1000}:${PVM_GID:-1000}"
    environment:
      CGO_ENABLED: "0"
      GOCACHE: /tmp/go-cache
    volumes:
      - ./dist:/src/dist
      - ./.local/bin:/src/.local/bin

  app-pvm:
    build:
      context: .
      target: runtime
    entrypoint: ["sleep", "infinity"]
    working_dir: /app
    volumes:
      - .:/app:ro
      - ./.local/apt/archives:/var/cache/apt/archives
    init: true
